name: Sync required status checks

# Apply half of the check-required-reporter pair. The pre-commit hook that's
# supposed to force every always() reporter to carry a
# `# required-check: true|false` annotation is NOT wired into this repo's
# .pre-commit-config.yaml — only 3 of the always() reporters in this tree
# (format-check-passed, hook-lifecycle-passed, zizmor-passed) actually carry
# one. The apply tool (hosted in ci-truth-serum) reads those annotations (the
# SSOT) and rewrites the branch-protection ruleset's required_status_checks
# to EXACTLY that annotated set — so until the missing annotations are added
# (or the tree's actual required checks are confirmed to already be exactly
# those 3), enabling this on a real push branch risks silently dropping any
# other currently-required check from the ruleset. See the `on:` comment
# below.
#
# Runs only post-merge on main (and on demand). It mutates branch protection, so
# it needs a token with `administration: write`; the stock GITHUB_TOKEN cannot
# edit rulesets. Provide it as the RULESET_SYNC_TOKEN_ORG secret — the job fails loud
# if it is absent. Not a required check itself (no pull_request trigger).
on:
  push:
    # NOT switched to `master` here despite this repo's default branch being
    # `master`, not `main` (the template's assumption) — `main`-only leaves
    # this workflow permanently unfireable by a normal merge here, so the
    # ruleset it maintains never self-heals. But only 3 jobs in the whole
    # tree carry a `# required-check: true` annotation (format-check-passed,
    # hook-lifecycle-passed, zizmor-passed) — lint.yml, idempotency.yml,
    # uninstall.yml, pr-meta.yaml have none. Since this tool rewrites
    # required_status_checks to EXACTLY the annotated set, flipping this
    # trigger live would risk silently dropping any of those from branch
    # protection if they're required today. Fix by first running
    # `workflow_dispatch` with `check-only: true` to see the actual drift,
    # then either annotate the missing gates or confirm they aren't
    # currently required, before enabling on `master`.
    branches: [main]
    paths:
      - .github/workflows/**
      - .pre-commit-config.yaml
  workflow_dispatch:
    inputs:
      check-only:
        description: "Report drift without mutating the ruleset"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize ruleset writes so two back-to-back merges can't race the PATCH.
  # Static group is intentional and safe here: this workflow has no pull_request
  # trigger, so it never backs a required check that a cancelled run could hang.
  group: sync-required-checks
  cancel-in-progress: false
  # static-concurrency-ok: not a required check (push/dispatch only)

jobs:
  sync:
    name: Sync ruleset to required-check annotations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the apply tool (ci-truth-serum)
        # Pin to the same ci-truth-serum commit the pre-commit hook uses so the
        # lint and the apply step share one parser version.
        run: python3 -m pip install --user "ci-truth-serum @ git+https://github.com/alexander-turner/ci-truth-serum@a5c3991e7b1eea7c8a65d9cd9573f3f65f520ee8"

      - name: Sync required status checks
        env:
          GH_TOKEN: ${{ secrets.RULESET_SYNC_TOKEN_ORG }}
          REPO: ${{ github.repository }}
          CHECK_ONLY: ${{ inputs.check-only }}
        run: |
          args=(--repo "$REPO")
          if [[ "$CHECK_ONLY" == "true" ]]; then
            args+=(--check)
          fi
          python3 -m ci_truth_serum.sync_required_checks "${args[@]}"
