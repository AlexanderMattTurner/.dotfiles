# TMux plugin manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-capture-pane-contents 'off' # pane-contents capture causes resurrect to hang on restore
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatic backup
set -g @continuum-save-interval '15'

# Continuum SAVES, but it does not restore — `bin/tmux-bootstrap.bash` does,
# called from the fish auto-launch. Continuum's restore is gated on
# `another_tmux_server_running_on_startup`, which counts
# `ps | grep "^tmux"` against 1 and so cannot tell a second tmux *client* from a
# second tmux *server*. Two iTerm2 windows restoring in parallel at login are
# enough to make it skip the restore silently — no message, no log, and a
# snapshot that still looks healthy on disk. Leaving it 'on' would race the
# bootstrap for the same snapshot. See bin/tmux-bootstrap.bash for the full
# write-up.
set -g @continuum-restore 'off'

# Restore vim sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Reap idle, empty sessions on attach and detach.
#
# bin/tmux-bootstrap.bash replays the resurrect snapshot at every server
# start, so an empty shell that happened to be open when a snapshot was taken
# is recreated forever. Unnamed sessions also get bare numeric names, so the
# junk ends up indistinguishable from real work. Collecting the empties lets
# the next continuum save record a clean set, which is what stops the clutter
# from returning after a restart.
#
# Sessions holding a real process are never touched; protect a deliberately
# empty one with `tmux set-option -t <name> @gc-keep 1`. Routed through the
# dispatcher symlink rather than a repo path so this keeps working wherever
# the repo is cloned, and no-ops before setup.bash has ever run.
set-hook -g client-attached 'run-shell -b "test -x $HOME/.local/bin/dotfiles && $HOME/.local/bin/dotfiles tmux-gc --quiet || true"'
set-hook -g client-detached 'run-shell -b "test -x $HOME/.local/bin/dotfiles && $HOME/.local/bin/dotfiles tmux-gc --quiet || true"'

# Enable copying
set -g @plugin 'tmux-plugins/tmux-yank'

set -g prefix C-b

# Use fish inside tmux regardless of $SHELL at server-start time
if-shell '[ "$(uname)" = Darwin ]' 'set -g default-shell /opt/homebrew/bin/fish' 'set -g default-shell /usr/bin/fish'

# Unconditionally bind keys for tmux pane navigation
bind-key -n 'C-h' select-pane -L
bind-key -n 'C-j' select-pane -D
bind-key -n 'C-k' select-pane -U
bind-key -n 'C-l' select-pane -R
bind-key -n 'C-\' select-pane -l

setw -g mode-keys vi

# Copy mode key bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Kill the tmux server after the last session is closed
# set-option -g destroy-unattached on  

set -g status-right 'Continuum: #{continuum_status}'

# Enable mouse scrolling by default
set -g mouse on
# Do NOT strip smcup/rmcup here. That is the pre-`mouse on` trick for scrolling
# with the *terminal's* native scrollback; with `mouse on` it backfires. Without
# the alternate screen, iTerm2 keeps its own scrollback under tmux and swallows
# the wheel for it, so neither copy-mode nor alt-screen apps (nvim, less) ever
# see the event.

# OSC 52 clipboard passthrough (copy over SSH/mosh)
set -g set-clipboard on
set -g allow-passthrough on

# Prevent spurious neovim line-switching behavior when hitting <esc-j> or <esc-k>
set -s escape-time 0


# Copy to the macOS clipboard on mouse-drag release, then exit copy mode
# (the -and-cancel avoids a lingering selection that could be pasted by accident)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Redraw screen to avoid garbled text
set-hook -g client-resized 'refresh-client -S'

# Focus events let Claude know when we're in a window
set -g focus-events on

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
